# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: connect this repo in the Render dashboard and it will read this file.
services:
  - type: web
    name: sitesignal-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sitesignal-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "60"
      - key: CORS_ORIGINS
        sync: false # set to the deployed Vercel URL(s) after the frontend is deployed
      - key: CRAWL_MAX_PAGES
        value: "100"
      - key: CRAWL_MAX_DEPTH
        value: "5"
      - key: CRAWL_TIMEOUT_SECONDS
        value: "10"
      - key: CRAWL_MAX_RESPONSE_BYTES
        value: "5000000"

databases:
  - name: sitesignal-db
    plan: free
    postgresMajorVersion: "16"
